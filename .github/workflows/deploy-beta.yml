name: Deploy beta

# Runs after a pull request is merged into develop (push to develop) and can be started by hand.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run pending TypeORM migrations (a database backup is taken first)"
        type: boolean
        default: false

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy develop to beta server
    needs: ci
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.BETA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BETA_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/beta_key
          chmod 600 ~/.ssh/beta_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.BETA_SSH_HOST }}
          PORT: ${{ secrets.BETA_SSH_PORT }}
          USER: ${{ secrets.BETA_SSH_USER }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations || 'false' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/beta_key -p "${PORT:-22}" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "RUN_MIGRATIONS=$RUN_MIGRATIONS EXPECTED_SHA=$EXPECTED_SHA bash -s" < scripts/deploy/deploy-beta.sh

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/beta_key
