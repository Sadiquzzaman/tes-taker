name: CI

on:
  pull_request:
    branches: [develop, main]
  # Called by deploy-beta.yml on every merge to develop, so beta never receives untested code.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm 9 (same version as backend/Dockerfile.prod)
        run: npm install -g pnpm@9
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  frontend:
    name: Frontend — install, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time public values only; no secrets. Real values come from the server at deploy time.
      NEXT_PUBLIC_BASE_URL: https://api-beta.instructor.academy/api/v1
      NEXT_PUBLIC_APP_URL: https://beta.instructor.academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
