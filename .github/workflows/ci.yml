name: CI

on:
  pull_request:
    branches: [develop, main]
  # Called by deploy-beta.yml on every merge to develop, so beta never receives untested code.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — install, lint, type-check, test, build
    runs-on: ubuntu-latest
    # Same commands developers run locally (root Makefile).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm 9 (same version as backend/Dockerfile.prod)
        run: npm install -g pnpm@9
      - name: Install
        run: make backend-install
      - name: Lint
        run: make backend-lint
      - name: Type-check
        run: make backend-typecheck
      - name: Test
        run: make backend-test
      - name: Build
        run: make backend-build

  migrations:
    name: Backend — migrations on an empty database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same image as docker-compose.prod.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasktaker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database only.
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DB: tasktaker_ci
      DATABASE_SYNCRONIZE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm 9 (same version as backend/Dockerfile.prod)
        run: npm install -g pnpm@9
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run all migrations
        run: pnpm migration:run:prod
      - name: No migration left pending
        run: |
          pnpm migration:show:prod | tee show.log
          if grep -q '\[ \]' show.log; then
            echo "::error::Migrations still pending after migration:run."
            exit 1
          fi
      - name: Schema matches the entities (no migration missing)
        run: pnpm migration:check

  api-tests-part:
    name: Backend — API tests, part ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # The API test files share one database, so within a run they go one at a time; three parts,
    # each with its own databases, run side by side: a third of the time, and a third of the
    # memory of one long process (each file starts the whole app, ~20 MB of which stays; one
    # process ran out of heap at ~75 files, #266).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Same images and host ports as docker-compose.test.yml, so backend/test/test.env works unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tasktaker_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tasktaker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 57017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm 9 (same version as backend/Dockerfile.prod)
        run: npm install -g pnpm@9
      - name: Install
        run: make backend-install
      - name: API tests (part ${{ matrix.shard }} of 4)
        working-directory: backend
        # Each test file starts the whole app and memory grows ~20 MB per file (docs/TODO.md);
        # four parts of ~22 files with a 4 GB heap leave room as files are added.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

  # One check with the old name, for the branch rules: green only when every part passed.
  api-tests:
    name: Backend — API tests (PostgreSQL, Redis, MongoDB)
    needs: api-tests-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All parts passed
        run: test "${{ needs.api-tests-part.result }}" = "success"

  frontend:
    name: Frontend — install, lint, type-check, test, build
    runs-on: ubuntu-latest
    # Same commands developers run locally (root Makefile).
    env:
      # Build-time public values only; no secrets. Real values come from the server at deploy time.
      NEXT_PUBLIC_BASE_URL: https://api-beta.instructor.academy/api/v1
      NEXT_PUBLIC_APP_URL: https://beta.instructor.academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm 9 (same version as frontend/Dockerfile.prod)
        run: npm install -g pnpm@9
      - name: Install
        run: make frontend-install
      - name: Lint
        run: make frontend-lint
      - name: Type-check
        # Runs `next typegen` first: next-env.d.ts is gitignored and tsc needs its image/route types.
        run: make frontend-typecheck
      - name: Test
        run: make frontend-test
      - name: Build
        run: make frontend-build
